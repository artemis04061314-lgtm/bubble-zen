<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="泡泡禪 Bubble Zen：沒有分數、沒有倒數的紓壓小遊戲。戳破泡泡，跟著呼吸放鬆。">
<title>泡泡禪 Bubble Zen</title>
<style>
  :root { --ui: rgba(255,255,255,.16); --ui-hover: rgba(255,255,255,.28); --text: #fff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; color: var(--text); touch-action: none; user-select: none; -webkit-user-select: none; }
  body { background: #1b1d45; transition: color .6s; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }

  .title { position: fixed; top: 22px; left: 0; right: 0; text-align: center; pointer-events: none; text-shadow: 0 1px 8px rgba(0,0,0,.25); }
  .title h1 { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: .3em; opacity: .9; }
  .title p { margin: 6px 0 0; font-size: 13px; opacity: .75; letter-spacing: .1em; transition: opacity 1.5s; }
  .title p.hide { opacity: 0; }

  .toast { position: fixed; top: 38%; left: 0; right: 0; text-align: center; font-size: 22px; letter-spacing: .15em; pointer-events: none; opacity: 0; transition: opacity 1.2s; text-shadow: 0 2px 12px rgba(0,0,0,.25); }
  .toast.show { opacity: .95; }

  .hud { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 999px; background: var(--ui); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .hud button { border: 0; background: transparent; color: inherit; font: inherit; font-size: 15px; padding: 8px 14px; border-radius: 999px; cursor: pointer; transition: background .2s; }
  .hud button:hover, .hud button:focus-visible { background: var(--ui-hover); outline: none; }
  .hud button[aria-pressed="true"] { background: var(--ui-hover); }
  .count { font-size: 13px; opacity: .8; padding: 0 8px; min-width: 72px; text-align: center; font-variant-numeric: tabular-nums; }

  .breath { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none; }
  .breath.on { display: flex; }
  .breath .ring { position: relative; width: min(60vmin, 360px); height: min(60vmin, 360px); animation: breathe 10s ease-in-out infinite; display: flex; align-items: center; justify-content: center; }
  .breath .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .breath .label { position: relative; font-size: 26px; letter-spacing: .4em; padding-left: .4em; text-shadow: 0 2px 10px rgba(0,0,0,.3); }
  @keyframes breathe { 0% { transform: scale(.55); } 40% { transform: scale(1); } 100% { transform: scale(.55); } }

  @media (prefers-reduced-motion: reduce) { .breath .ring { animation-duration: 16s; } }
</style>
</head>
<body>
<canvas id="c" aria-label="泡泡畫布"></canvas>

<div class="title">
  <h1>泡 泡 禪</h1>
  <p id="hint">輕點，或按住滑過泡泡</p>
</div>

<div class="breath" id="breath" aria-hidden="true">
  <div class="ring">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><radialGradient id="ringFill"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
      <polygon points="50,1 92.4,25.5 92.4,74.5 50,99 7.6,74.5 7.6,25.5" fill="url(#ringFill)" stroke="rgba(255,255,255,.55)" stroke-width="0.6" stroke-linejoin="round"/>
    </svg>
    <div class="label" id="breathLabel">吸氣</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="hud" role="toolbar" aria-label="控制列">
  <button id="btnSound" aria-pressed="false" title="音效">🔊 音效</button>
  <button id="btnBreath" aria-pressed="false" title="呼吸引導">🌬 呼吸</button>
  <button id="btnTheme" title="切換主題">🎨 <span id="themeName">夜空</span></button>
  <span class="count" id="count">0 個泡泡</span>
</div>

<script>
(() => {
  'use strict';

  // ---------- 基本設定 ----------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const THEMES = [
    { name: '夜空', bg: 'radial-gradient(ellipse at 50% 120%, #4a468f 0%, #1f2150 55%, #0d0f2b 100%)', hue: [190, 300] },
    { name: '海洋', bg: 'linear-gradient(180deg, #1383a3 0%, #0a4a6e 60%, #062a45 100%)',            hue: [150, 220] },
    { name: '晨光', bg: 'linear-gradient(180deg, #ffcfb8 0%, #ffb3cc 50%, #b9a3ff 100%)',            hue: [290, 350] },
  ];

  const store = {
    get(k, d) { try { const v = localStorage.getItem('bubblezen.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('bubblezen.' + k, JSON.stringify(v)); } catch (e) { /* 忽略 */ } },
  };

  let themeIdx = Math.min(store.get('theme', 0), THEMES.length - 1);
  let muted = store.get('muted', false);
  let total = store.get('total', 0);
  let session = 0;

  const $ = id => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);

  // ---------- 音效（WebAudio，無外部檔案） ----------
  let actx = null, master = null;
  const SCALE = [0, 2, 4, 7, 9]; // C 大調五聲音階，怎麼戳都好聽

  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.45;
    const delay = actx.createDelay(); delay.delayTime.value = 0.23;
    const fb = actx.createGain(); fb.gain.value = 0.32;
    delay.connect(fb); fb.connect(delay);
    master.connect(actx.destination);
    master.connect(delay); delay.connect(actx.destination);
  }

  function playPop(r) {
    if (!actx || muted) return;
    // 泡泡越大音越低
    const idx = Math.max(0, Math.min(9, Math.round((70 - r) / 48 * 9)));
    const semi = SCALE[idx % 5] + 12 * Math.floor(idx / 5);
    const f = 261.63 * Math.pow(2, semi / 12);
    const t = actx.currentTime;
    [[f, 'sine', 0.26, 1.3], [f * 2, 'triangle', 0.07, 0.6]].forEach(([freq, type, vol, dur]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + dur + 0.05);
    });
  }

  // ---------- 泡泡 / 粒子 ----------
  const bubbles = [], particles = [], rings = [];
  let last = performance.now();
  let time = 0;

  function spawn(initial) {
    const r = rand(22, 70);
    const th = THEMES[themeIdx];
    const speedScale = reduceMotion ? 0.5 : 1;
    bubbles.push({
      r,
      baseX: rand(r, Math.max(r + 1, W - r)),
      x: 0,
      y: initial ? rand(0, H) : H + r + 10,
      vy: -(18 + (80 - r) * rand(0.25, 0.7)) * speedScale,
      amp: reduceMotion ? 0 : rand(6, 22),
      freq: rand(0.4, 1.1),
      phase: rand(0, Math.PI * 2),
      hue: rand(th.hue[0], th.hue[1]),
      rot: rand(0, Math.PI / 3),
      spin: reduceMotion ? 0 : rand(-0.25, 0.25), // 緩慢自轉（弧度／秒）
    });
  }

  // ---------- 六角形工具 ----------
  // 以 (x, y) 為中心、外接圓半徑 r、旋轉 rot 的正六角形路徑
  function hexPath(x, y, r, rot) {
    ctx.beginPath();
    for (let k = 0; k < 6; k++) {
      const a = rot + k * Math.PI / 3;
      const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
  }

  // 點 (px, py) 是否落在六角形內（pad 為額外容錯）
  function inHex(px, py, b, pad) {
    const dx = px - b.x, dy = py - b.y;
    const c = Math.cos(-b.rot), s = Math.sin(-b.rot);
    const lx = Math.abs(dx * c - dy * s), ly = Math.abs(dx * s + dy * c);
    const R = b.r + pad, h = R * Math.sqrt(3) / 2;
    return ly <= h && Math.sqrt(3) * lx + ly <= Math.sqrt(3) * R;
  }

  function targetCount() { return Math.max(12, Math.min(30, Math.round(W * H / 30000))); }
  for (let i = 0; i < targetCount(); i++) spawn(true);

  function pop(b, idx) {
    bubbles.splice(idx, 1);
    const n = 12 + Math.round(b.r / 8);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rand(-0.2, 0.2);
      const sp = rand(40, 130);
      particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, size: rand(1.5, 4), hue: b.hue });
    }
    rings.push({ x: b.x, y: b.y, r: b.r, max: b.r * 1.9, life: 1, hue: b.hue, rot: b.rot });
    playPop(b.r);
    session++; total++;
    updateCount();
    if (session % 20 === 0) showToast(MESSAGES[Math.floor(Math.random() * MESSAGES.length)]);
    if (total % 10 === 0) store.set('total', total);
  }

  function popAt(x, y) {
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      if (inHex(x, y, b, 4)) { pop(b, i); return true; }
    }
    return false;
  }

  // ---------- 繪製 ----------
  function drawBubble(b) {
    const { x, y, r, hue, rot } = b;
    const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
    g.addColorStop(0, `hsla(${hue}, 90%, 92%, .30)`);
    g.addColorStop(0.7, `hsla(${hue}, 85%, 75%, .16)`);
    g.addColorStop(1, `hsla(${hue}, 90%, 85%, .42)`);
    hexPath(x, y, r, rot);
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.strokeStyle = `hsla(${hue}, 100%, 95%, .55)`; ctx.stroke();
    // 高光
    ctx.beginPath();
    ctx.ellipse(x - r * 0.38, y - r * 0.42, r * 0.2, r * 0.11, -0.6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fill();
  }

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now; time += dt;
    ctx.clearRect(0, 0, W, H);

    // 補充泡泡
    if (bubbles.length < targetCount() && Math.random() < dt * 2.5) spawn(false);

    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.y += b.vy * dt;
      b.x = b.baseX + Math.sin(time * b.freq + b.phase) * b.amp;
      b.rot += b.spin * dt;
      if (b.y < -b.r * 2) { bubbles.splice(i, 1); continue; } // 飄走了，沒關係
      drawBubble(b);
    }

    for (let i = rings.length - 1; i >= 0; i--) {
      const o = rings[i];
      o.life -= dt * 1.8;
      if (o.life <= 0) { rings.splice(i, 1); continue; }
      const rr = o.r + (o.max - o.r) * (1 - o.life);
      hexPath(o.x, o.y, rr, o.rot || 0);
      ctx.lineWidth = 2; ctx.strokeStyle = `hsla(${o.hue}, 100%, 95%, ${o.life * 0.6})`; ctx.stroke();
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt * 1.4;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.96; p.vy = p.vy * 0.96 + 30 * dt;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 100%, 92%, ${p.life * 0.9})`; ctx.fill();
    }

    if (breathOn) updateBreathLabel(now);
    requestAnimationFrame(frame);
  }

  // ---------- 輸入 ----------
  let down = false;
  canvas.addEventListener('pointerdown', e => {
    initAudio();
    down = true;
    if (!popAt(e.clientX, e.clientY)) {
      // 點空白處也有輕輕的漣漪
      rings.push({ x: e.clientX, y: e.clientY, r: 4, max: 36, life: 1, hue: rand(...THEMES[themeIdx].hue), rot: rand(0, Math.PI / 3) });
    }
    hideHint();
  });
  canvas.addEventListener('pointermove', e => { if (down) popAt(e.clientX, e.clientY); });
  window.addEventListener('pointerup', () => { down = false; });
  window.addEventListener('pointercancel', () => { down = false; });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); initAudio(); if (bubbles.length) { const b = bubbles[Math.floor(Math.random() * bubbles.length)]; pop(b, bubbles.indexOf(b)); } hideHint(); }
  });

  // ---------- UI ----------
  const MESSAGES = ['深呼吸，慢慢來', '你已經做得很好了', '放鬆肩膀', '此刻只需要這樣就夠了', '讓煩惱隨泡泡飄走', '喝口水，伸個懶腰吧'];
  let toastTimer = null;
  function showToast(text) {
    const t = $('toast'); t.textContent = text; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }
  function hideHint() { $('hint').classList.add('hide'); }
  setTimeout(hideHint, 8000);
  function updateCount() { $('count').textContent = session + ' 個泡泡'; }

  function applyTheme() {
    const th = THEMES[themeIdx];
    document.body.style.background = th.bg;
    $('themeName').textContent = th.name;
    // 讓現有泡泡慢慢換成新色系
    bubbles.forEach(b => { b.hue = rand(th.hue[0], th.hue[1]); });
    store.set('theme', themeIdx);
  }
  $('btnTheme').addEventListener('click', () => { themeIdx = (themeIdx + 1) % THEMES.length; applyTheme(); });

  function applySound() {
    $('btnSound').setAttribute('aria-pressed', String(!muted));
    $('btnSound').textContent = muted ? '🔇 靜音' : '🔊 音效';
    store.set('muted', muted);
  }
  $('btnSound').addEventListener('click', () => { initAudio(); muted = !muted; applySound(); });

  // 呼吸引導：吸氣 4 秒、吐氣 6 秒（共 10 秒，與 CSS 動畫同步）
  let breathOn = false, breathStart = 0;
  function updateBreathLabel(now) {
    const sec = ((now - breathStart) / 1000) % 10;
    const label = sec < 4 ? '吸氣' : '吐氣';
    const el = $('breathLabel');
    if (el.textContent !== label) el.textContent = label;
  }
  $('btnBreath').addEventListener('click', () => {
    breathOn = !breathOn;
    const el = $('breath');
    el.classList.toggle('on', breathOn);
    el.setAttribute('aria-hidden', String(!breathOn));
    $('btnBreath').setAttribute('aria-pressed', String(breathOn));
    if (breathOn) {
      // 重新啟動動畫，讓文字與圓圈對齊
      const ring = el.querySelector('.ring');
      ring.style.animation = 'none'; void ring.offsetWidth; ring.style.animation = '';
      breathStart = performance.now();
    }
  });

  applyTheme(); applySound(); updateCount();
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
